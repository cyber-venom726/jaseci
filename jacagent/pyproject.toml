[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jacagent"
dynamic = ["version"]
description = "Next-generation agentic framework with enhanced customization and plugin architecture"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "JacAgent Contributors", email = "contributors@jacagent.dev" },
]
keywords = [
    "ai",
    "agents", 
    "llm",
    "automation",
    "multi-agent",
    "orchestration",
    "plugins",
    "workflow"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "aiofiles>=23.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "asyncio-mqtt>=0.13.0",
    "tenacity>=8.0.0",
    "structlog>=23.0.0",
    "pluggy>=1.3.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "redis>=4.5.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.11.0",
    "prometheus-client>=0.17.0",
    "opentelemetry-api>=1.19.0",
    "opentelemetry-sdk>=1.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "pre-commit>=3.0.0",
    "ruff>=0.0.280",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.22.0",
]
llm = [
    "openai>=1.0.0",
    "anthropic>=0.3.0",
    "cohere>=4.0.0",
    "huggingface-hub>=0.16.0",
    "transformers>=4.30.0",
    "torch>=2.0.0",
]
vector = [
    "chromadb>=0.4.0",
    "pinecone-client>=2.2.0",
    "weaviate-client>=3.22.0",
    "qdrant-client>=1.4.0",
]
monitoring = [
    "wandb>=0.15.0",
    "mlflow>=2.5.0",
    "langsmith>=0.0.30",
]

[project.urls]
Homepage = "https://github.com/jacagent/jacagent"
Documentation = "https://docs.jacagent.dev"
Repository = "https://github.com/jacagent/jacagent"
"Bug Tracker" = "https://github.com/jacagent/jacagent/issues"

[project.scripts]
jacagent = "jacagent.cli:main"

[tool.hatch.version]
path = "jacagent/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["jacagent"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py310"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
