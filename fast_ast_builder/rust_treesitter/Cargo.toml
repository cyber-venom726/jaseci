// Cargo.toml for Rust AST builder
[package]
name = "jac_ast_builder"
version = "0.1.0"
edition = "2021"

[dependencies]
tree-sitter = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tree-sitter-jac = { path = "./tree-sitter-jac" }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies.pyo3]
version = "0.20"
features = ["extension-module"]
